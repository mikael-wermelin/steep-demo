module:
  schema: "public"
  table: "bookings"
  identifier: "bookings"
  label: "Bookings"
  description: "One row per booking (view over the fact table). Use for booking counts, passengers, cancellations and margin without double counting."
  dimensions:
    - column: "pax_group"
      type: "categorical"
      label: "Passengers in booking"
  joinPaths:
    - from: { column: "booking_id" }
      to: { table: "dim_booking", column: "booking_id" }
      type: "one-to-one"
  metrics:
    - identifier: "bookings_made"
      name: "Bookings made"
      description: "Number of bookings, dated by booking date (includes later-cancelled bookings)."
      category: "Commercial"
      type: "count"
      time: "bookings.booking_date"
      dimensions: ["this.*", "public.dim_booking.*", "public.dim_market.*", "public.dim_accommodation.*", "public.dim_transport.*"]
    - identifier: "departing_bookings"
      name: "Departing bookings"
      description: "Number of non-cancelled bookings, dated by first departure."
      category: "Operations"
      type: "count"
      time: "bookings.first_departure_date"
      filters:
        - column: "is_cancelled"
          operator: "equals"
          expression: "false"
      dimensions: ["this.*", "public.dim_booking.*", "public.dim_market.*", "public.dim_accommodation.*", "public.dim_transport.*"]
    - identifier: "cancelled_bookings"
      name: "Cancelled bookings"
      description: "Number of bookings that were cancelled, dated by booking date."
      category: "Commercial"
      type: "count"
      time: "bookings.booking_date"
      filters:
        - column: "is_cancelled"
          operator: "equals"
          expression: "true"
      dimensions: ["this.*", "public.dim_booking.*", "public.dim_market.*", "public.dim_accommodation.*", "public.dim_transport.*"]
    - identifier: "cancellation_rate"
      name: "Cancellation rate"
      description: "Cancelled bookings / bookings made, by booking date."
      category: "Commercial"
      type: "derived-ratio"
      numerator: "cancelled_bookings"
      denominator: "bookings_made"
      format: "percentage"
      dimensions: ["this.*", "public.dim_booking.*", "public.dim_market.*", "public.dim_accommodation.*", "public.dim_transport.*"]
    - identifier: "passengers"
      name: "Passengers travelling"
      description: "Sum of pax on non-cancelled bookings, dated by first departure."
      category: "Operations"
      type: "sum"
      time: "bookings.first_departure_date"
      value: "bookings.pax"
      filters:
        - column: "is_cancelled"
          operator: "equals"
          expression: "false"
      dimensions: ["this.*", "public.dim_booking.*", "public.dim_market.*", "public.dim_accommodation.*", "public.dim_transport.*"]
    - identifier: "booking_sales"
      name: "Sales per booking total"
      description: "Sum of booking sales in group currency, dated by first departure."
      category: "Commercial"
      type: "sum"
      time: "bookings.first_departure_date"
      value: "bookings.sales_global"
      dimensions: ["this.*", "public.dim_booking.*", "public.dim_market.*", "public.dim_accommodation.*", "public.dim_transport.*"]
    - identifier: "gross_margin"
      name: "Gross margin"
      description: "Sales minus costs in group currency, dated by first departure."
      category: "Commercial"
      type: "sum"
      time: "bookings.first_departure_date"
      value: "bookings.margin_global"
      dimensions: ["this.*", "public.dim_booking.*", "public.dim_market.*", "public.dim_accommodation.*", "public.dim_transport.*"]
    - identifier: "gross_margin_pct"
      name: "Gross margin %"
      description: "Gross margin / sales."
      category: "Commercial"
      type: "derived-ratio"
      numerator: "gross_margin"
      denominator: "booking_sales"
      format: "percentage"
      dimensions: ["this.*", "public.dim_booking.*", "public.dim_market.*", "public.dim_accommodation.*", "public.dim_transport.*"]
    - identifier: "sales_per_passenger"
      name: "Sales per passenger"
      description: "Booking sales / passengers travelling."
      category: "Commercial"
      type: "derived-ratio"
      numerator: "booking_sales"
      denominator: "passengers"
      format: "number"
      dimensions: ["this.*", "public.dim_booking.*", "public.dim_market.*", "public.dim_accommodation.*", "public.dim_transport.*"]
