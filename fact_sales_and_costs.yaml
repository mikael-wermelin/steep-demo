module:
  schema: "public"
  table: "fact_sales_and_costs"
  identifier: "fact_sales_and_costs"
  label: "Sales & costs (line level)"
  description: "One row per booking and product group line. Amounts in local and group currency. Use for product-group breakdowns; use the bookings module for booking/pax counts."
  metrics:
    - identifier: "sales_by_departure"
      name: "Sales (by departure date)"
      description: "Sum of sales in group currency, dated by first departure."
      category: "Commercial"
      type: "sum"
      time: "fact_sales_and_costs.first_departure_date"
      value: "fact_sales_and_costs.sales_global"
      dimensions: ["public.dim_booking.*", "public.dim_market.*", "public.dim_accommodation.*", "public.dim_transport.*", "public.dim_product_group.*"]
    - identifier: "sales_by_booking"
      name: "Sales (by booking date)"
      description: "Sum of sales in group currency, dated by when the booking was made. Shows order intake."
      category: "Commercial"
      type: "sum"
      time: "fact_sales_and_costs.booking_date"
      value: "fact_sales_and_costs.sales_global"
      dimensions: ["public.dim_booking.*", "public.dim_market.*", "public.dim_accommodation.*", "public.dim_transport.*", "public.dim_product_group.*"]
    - identifier: "costs_by_departure"
      name: "Costs (by departure date)"
      description: "Sum of costs in group currency, dated by first departure."
      category: "Commercial"
      type: "sum"
      time: "fact_sales_and_costs.first_departure_date"
      value: "fact_sales_and_costs.cost_global"
      dimensions: ["public.dim_booking.*", "public.dim_market.*", "public.dim_accommodation.*", "public.dim_transport.*", "public.dim_product_group.*"]
